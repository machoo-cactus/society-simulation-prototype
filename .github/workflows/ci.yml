name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate Linux setup helper
        run: bash -n update.sh
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: python -m pytest
        env:
          STAGE0_RUN_PLAYWRIGHT: "1"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Check installed dependencies
        run: python -m pip check
      - name: Exercise CLI
        run: stage0-sim run scenarios/minimal.json --ticks 2 --database "${RUNNER_TEMP}/smoke.sqlite3" > "${RUNNER_TEMP}/events.jsonl"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
