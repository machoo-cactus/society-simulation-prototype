[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stage0-simulation"
dynamic = ["version"]
description = "Deterministic embodied-character simulation and research sandbox"
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "agent simulation",
    "deterministic simulation",
    "embodied characters",
    "research data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
stage0-sim = "stage0_sim.cli:main"
stage0-fake-llm = "stage0_sim.api.fake_llm:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "playwright>=1.55,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/machoo-cactus/society-simulation-prototype"
Issues = "https://github.com/machoo-cactus/society-simulation-prototype/issues"
Repository = "https://github.com/machoo-cactus/society-simulation-prototype.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "stage0_sim.__version__"}

[tool.setuptools.package-data]
stage0_sim = [
    "py.typed",
    "web/templates/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "resources/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "model_contract: deterministic controller, compiler, replay, and provider protocol checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/stage0_sim"]
